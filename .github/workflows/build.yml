name: Build External Repository

on:
  workflow_dispatch: # Cho phép bạn bấm nút chạy thủ công từ tab Actions

jobs:
  build-external:
    runs-on: ubuntu-latest

    steps:
      # Bước 1: Clone Repository khác
      - name: Checkout External Repo
        uses: actions/checkout@v4
        with:
          repository: 'TranTam31/countdown-widget' # Ví dụ: 'facebook/react'
          ref: 'main'                          # Nhánh muốn clone
          path: 'external-project'             # Thư mục sẽ chứa code clone về
          # token: ${{ secrets.MY_PAT }}       # Mở comment này nếu repo kia là Private

      # Bước 2: Thiết lập Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Override Vite Config
        run: |
          cat <<EOF > vite.config.ts
          import { defineConfig } from "vite";
          import react from "@vitejs/plugin-react";
          import { viteSingleFile } from "vite-plugin-singlefile";
          import { viteStaticCopy } from "vite-plugin-static-copy";

          import type { Plugin } from "vite";

          function forbidImagesPlugin(): Plugin {
            return {
              name: "forbid-images",
              enforce: "pre",
              resolveId(source: string) {
                if (/\.(png|jpe?g)$/i.test(source)) {
                  throw new Error(`❌ Image files are not allowed: ${source}`);
                }
                return null;
              },
            };
          }

          export default defineConfig({
            publicDir: false,
            plugins: [
              react(),
              viteSingleFile(),
              forbidImagesPlugin(),
              viteStaticCopy({
                targets: [
                  {
                    src: "src/config/widget-config.json",
                    dest: ".",
                  },
                ],
              }),
            ],
          });
          EOF

      # Bước 3: Di chuyển vào thư mục đã clone và build
      - name: Install and Build
        run: |
          cd external-project
          npm install
          npm run build
