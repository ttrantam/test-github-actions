name: Dynamic Build Tool

on:
  workflow_dispatch:
    inputs:
      repo_url:
        description: 'Đường dẫn repo (dạng user/repo)'
        required: true
        default: 'TranTam31/countdown-widget'
      branch:
        description: 'Nhánh muốn build'
        required: true
        default: 'main'

jobs:
  build-external:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout External Repo
        uses: actions/checkout@v4
        with:
          # Sử dụng giá trị từ input người dùng nhập vào
          repository: ${{ github.event.inputs.repo_url }}
          ref: ${{ github.event.inputs.branch }}
          path: 'external-project'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Override Vite Config
        run: |
          cat <<'EOF' > external-project/vite.config.ts
          # ... (Giữ nguyên nội dung file config của bạn ở đây)
          EOF

      - name: Install and Build
        run: |
          cd external-project
          npm install
          npm run build

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          # Đặt tên file zip theo tên repo cho dễ phân biệt
          name: build-${{ github.run_id }}
          path: external-project/dist/
