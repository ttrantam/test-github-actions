name: Build External Repository
on:
  workflow_dispatch:

jobs:
  build-external:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout External Repo
        uses: actions/checkout@v4
        with:
          repository: 'TranTam31/countdown-widget'
          ref: 'main'
          path: 'external-project'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Chú ý: Dùng 'EOF' để giữ nguyên icon ❌ và nội dung file
      # Và ghi đè trực tiếp vào thư mục external-project
      - name: Override Vite Config
        run: |
          cat <<'EOF' > external-project/vite.config.ts
          import { defineConfig } from "vite";
          import react from "@vitejs/plugin-react";
          import { viteSingleFile } from "vite-plugin-singlefile";
          import { viteStaticCopy } from "vite-plugin-static-copy";
          import type { Plugin } from "vite";

          function forbidImagesPlugin(): Plugin {
            return {
              name: "forbid-images",
              enforce: "pre",
              resolveId(source: string) {
                if (/\.(png|jpe?g)$/i.test(source)) {
                  throw new Error(`❌ Image files are not allowed: ${source}`);
                }
                return null;
              },
            };
          }

          export default defineConfig({
            publicDir: false,
            plugins: [
              react(),
              viteSingleFile(),
              forbidImagesPlugin(),
              viteStaticCopy({
                targets: [
                  {
                    src: "src/config/widget-config.json",
                    dest: ".",
                  },
                ],
              }),
            ],
          });
          EOF

      - name: Install and Build
        run: |
          cd external-project
          npm install
          # Kiểm tra file đã được ghi đè chưa (tùy chọn để debug)
          cat vite.config.ts
          npm run build
